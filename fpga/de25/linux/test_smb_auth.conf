[global]
   workgroup = WORKGROUP
   server role = standalone server
   map to guest = Never
   interfaces = 127.0.0.1 192.168.1.3
   bind interfaces only = yes
   hosts allow = 127.0.0.1 192.168.1.52
   server min protocol = SMB3_11
   log level = 1

[astra-auth]
   path = /srv/astra
   valid users = astratest
   read only = no
   create mask = 0600
   directory mask = 0700
