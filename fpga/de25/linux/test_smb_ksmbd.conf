# Disposable Beast interoperability fixture; share path contains no production data.
[global]
   server min protocol = SMB3_11
   server max protocol = SMB3_11
   interfaces = enp12s0
   bind interfaces only = yes
   map to guest = never

[astra-ksmbd]
   path = /var/tmp/astra-ksmbd-test/share
   valid users = barry
   guest ok = no
   read only = no
   create mask = 0600
   directory mask = 0700
